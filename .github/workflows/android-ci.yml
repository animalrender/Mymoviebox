name: Android APK CI, E2E Emulator & Release

on:
  push:
    branches:
      - arena/89e1e39f-mymoviebox
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (e.g. v9-offline-favs-1) to publish GitHub Release assets'
        required: false
        default: ''

permissions:
  contents: write
  checks: write

jobs:
  build-and-emulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download verified apktool 3.0.3
        run: |
          mkdir -p tools/apktool-bin
          APKTOOL_VERSION="3.0.3"
          APKTOOL_SHA256="dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423"
          curl -fsSL "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" -o "tools/apktool-bin/apktool_${APKTOOL_VERSION}.jar"
          echo "${APKTOOL_SHA256}  tools/apktool-bin/apktool_${APKTOOL_VERSION}.jar" | sha256sum -c -
          ln -sf "apktool_${APKTOOL_VERSION}.jar" tools/apktool-bin/apktool.jar

      - name: Decode, patch, compile classes8.dex, rebuild & sign APKs (universal + per-ABI)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          mkdir -p build dist logs screenshots
          EXTRA_ARGS=""
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > build/release.jks
            EXTRA_ARGS="--keystore build/release.jks"
          fi
          python3 scripts/patch-apk.py \
            --input apks/mymoviebox.apk \
            --work build/patch-work \
            --out dist \
            --apktool tools/apktool-bin/apktool.jar \
            --abis universal,arm64-v8a,armeabi-v7a,x86_64,x86 \
            --version-label v9 \
            $EXTRA_ARGS 2>&1 | tee logs/patch-build.log
          ls -lh dist/
          cat dist/SHA256SUMS.txt

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || true

      - name: Run Offline Favorites E2E UI Test on API 33 Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            python3 scripts/ci-emulator-test.py \
              --apk dist/mymoviebox-offline-favs-v9-universal.apk \
              --screenshots screenshots \
              --logs logs

      - name: Upload built APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patched-apks
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/build-manifest.json
          retention-days: 30

      - name: Upload emulator screenshots & logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-e2e-artifacts
          path: |
            screenshots/
            logs/
          retention-days: 14

      - name: Mirror E2E diagnostics & screenshots to GitHub Check Run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          job_status = os.environ["JOB_STATUS"]

          def api_post(path, payload):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          blob_entries = []
          for p in sorted(Path("screenshots").glob("*.png")):
              b64 = base64.b64encode(p.read_bytes()).decode("ascii")
              res = api_post("git/blobs", {"content": b64, "encoding": "base64"})
              blob_entries.append({"file": p.name, "sha": res["sha"], "bytes": p.stat().st_size})

          summary_parts = [f"Job status: **{job_status}**\n"]
          sums = Path("dist/SHA256SUMS.txt")
          if sums.is_file():
              summary_parts.append("### Built APKs\n```\n" + sums.read_text(encoding="utf-8") + "```\n")
          e2e_sum = Path("logs/e2e-summary.txt")
          if e2e_sum.is_file():
              summary_parts.append("### E2E Summary\n```\n" + e2e_sum.read_text(encoding="utf-8") + "```\n")
          if blob_entries:
              summary_parts.append("### Screenshots (Git Blobs)\n```json\n" + json.dumps(blob_entries, indent=2) + "\n```\n")

          text_parts = []
          for label, p in [
              ("window-focus.txt", Path("logs/window-focus.txt")),
              ("offline_favorites_v1.xml", Path("logs/offline_favorites_v1.xml")),
              ("patch-build.log", Path("logs/patch-build.log")),
          ]:
              if p.is_file():
                  text_parts.append(f"## {label}\n```\n{p.read_text(encoding='utf-8', errors='replace')[-12000:]}\n```\n")

          lc = Path("logs/logcat-e2e.txt")
          if lc.is_file():
              lines = [
                  l for l in lc.read_text(encoding="utf-8", errors="replace").splitlines()
                  if any(k in l for k in ("com.delfan", "AndroidRuntime", "favs", "FATAL", "Exception", "Error"))
              ]
              text_parts.append("## Filtered Logcat\n```\n" + "\n".join(lines[-250:]) + "\n```\n")

          full_text = "\n".join(text_parts)[:64000]
          conclusion = "success" if job_status == "success" else "failure"
          api_post(
              "check-runs",
              {
                  "name": "Offline Favorites E2E Report",
                  "head_sha": sha,
                  "status": "completed",
                  "conclusion": conclusion,
                  "output": {
                      "title": f"Offline Favorites E2E ({conclusion})",
                      "summary": "\n".join(summary_parts)[:64000],
                      "text": full_text,
                  },
              },
          )
          print("Check run published with", len(blob_entries), "screenshot blobs.")
          PY

      - name: Publish GitHub Release (on tag or manual release_tag dispatch)
        if: ${{ success() && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/*.apk dist/SHA256SUMS.txt dist/build-manifest.json --clobber
          else
            gh release create "$TAG_NAME" \
              dist/*.apk dist/SHA256SUMS.txt dist/build-manifest.json \
              --target "${{ github.sha }}" \
              --title "Mymoviebox Offline Favorites ($TAG_NAME)" \
              --notes-file <(
                echo "## Mymoviebox v9 — Offline Favorites & Folders Edition"
                echo ""
                echo "- 100% offline Favorites without login required"
                echo "- Favorites tab with **All / Movies / Series / Folders** (همه / سینمایی / سریال / پوشه‌ها)"
                echo "- Create, rename, and delete custom collections/folders"
                echo "- JSON Backup Export & Restore via Android Storage Access Framework"
                echo "- Pure Dalvik APK signed with v1/v2/v3; both \`universal\` and per-ABI packages included"
                echo ""
                echo "### SHA-256 Checksums"
                echo '```'
                cat dist/SHA256SUMS.txt
                echo '```'
              )
          fi
